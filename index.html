<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Your 2025 Wrapped</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main id="app">

    <section class="section active" data-section="hero">
      <button id="startBtn" class="play">
        ▶
      </button>

      <h1 class="reveal">Your 2025 Wrapped</h1>
      <p class="reveal">
        Bu sene seni dinledim.<br>
        Algoritma değil,<br>
        kalbim hesapladı.
      </p>
      <span class="tap reveal">dokun</span>
    </section>

    <section class="section" data-section="traits">
      <h2 class="reveal">En Çok Dinlenen Özelliklerin</h2>
      <ul>
        <li class="reveal">%92 Gülüşün</li>
        <li class="reveal">%88 Sabır</li>
        <li class="reveal">%100 Samimiyet</li>
        <li class="reveal">%∞ Yanımda Olma Hissi</li>
      </ul>
      <button data-next>Devam Et</button>
    </section>

    <section class="section" data-section="end">
      <h1 class="reveal">Wrapped Bitti</h1>
      <p class="reveal">
        Ama seni dinlemeye<br>
        devam ediyorum.
      </p>
      <span class="signature reveal">— Kaan</span>
    </section>

  </main>

  <audio id="music" src="music.mp3" loop></audio>
  <script src="script.js"></script>
</body>
</html>
